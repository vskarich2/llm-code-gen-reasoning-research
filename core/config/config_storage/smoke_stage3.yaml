experiment:
  name: smoke_stage3
  description: 'Stage 3: multi-model check, 2 models, 2 conditions, 5 cases, 1 trial'
  tags:
  - smoke
  - stage3
  seed: 42
run:
  trial: 1
  run_id: smoke_s3
  run_dir: logs/smoke_stage3
models:
  generation:
  - name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_v2:
    retry:
      enabled: false
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 5
evaluation:
  classifier_mode: grounded
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 20
  mode: canonical
  keep_eval_dirs: false
  subprocess_timeout: 30
  worker_stagger_seconds: 1
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-5-mini: 16000
    default: 10000
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 1
