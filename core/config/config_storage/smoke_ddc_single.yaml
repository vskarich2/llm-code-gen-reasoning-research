experiment:
  name: smoke_ddc_single
  description: "Single case smoke: serialization_pipeline_chain_trap_1 (gpt-5-mini fell for trap), 3 conditions"
  tags:
    - smoke
    - deep_dependency_chain
  seed: 42

run:
  trial: 1
  run_id: smoke_ddc_single_001
  run_dir: logs/smoke_ddc_single

models:
  generation:
    - name: gpt-5-mini
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
    - o1
    - o3
    - o4
    - gpt-5

conditions:
  baseline_v3:
    retry:
      enabled: false
  critique_reasoning_only_v3:
    retry:
      enabled: true
      max_attempts: 3
      feedback:
        include_test_output: false
        include_critique: true
        include_previous_code: true
      stopping:
        stop_on_pass: true
        stop_on_stagnation: false
    critique:
      enabled: true
  critique_strict_v3:
    retry:
      enabled: true
      max_attempts: 3
      feedback:
        include_test_output: false
        include_critique: true
        include_previous_code: true
      stopping:
        stop_on_pass: true
        stop_on_stagnation: false
    critique:
      enabled: true

oracle:
  inline_enabled: true
  model: gpt-5-mini
  prompt_template: oracle_reasoning_truth_enriched
  partial_mode: lenient
  sampling_strategy: ALWAYS

evaluation:
  classifier_mode: blind
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict

cases:
  source: case_data/cases_v2.json
  case_ids:
    - serialization_pipeline_chain_trap_1

execution:
  num_workers: 3
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  validate_prompts: true
  token_budgets:
    gpt-5-mini: 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192

prompts:
  output_format: v2

logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false

trials: 1
