experiment:
  name: v3_full_ablation
  description: 'V3 prompt family ablation: 2 models, 5 conditions (3 v2 + 2 v3), all
    cases, 3 trials. V3 binary classifier.'
  tags:
  - v3
  - ablation
  - full
  seed: 42
run:
  trial: 1
  run_id: v3_ablation
  run_dir: logs/v3_full_ablation
models:
  generation:
  - name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false
  leg_reduction_v2:
    retry:
      enabled: false
  baseline_v3:
    retry:
      enabled: false
  leg_reduction_lean_v3:
    retry:
      enabled: false
evaluation:
  classifier_mode: grounded
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
execution:
  num_workers: 100
  worker_stagger_seconds: 0
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-5-mini: 16000
    default: 10000
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 3
