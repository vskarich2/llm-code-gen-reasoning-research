experiment:
  name: retry_critique_stage1
  description: "Stage 1: effect-size screening, 20 pairs \xD7 4 conditions \xD7 20\
    \ trials"
  tags:
  - retry
  - critique
  - stage1
  seed: 42
run:
  trial: 1
  run_id: rc_s1
  run_dir: logs/retry_critique_stage1
models:
  generation:
  - name: gpt-5.4-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  - name: gpt-4o-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  - name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  - name: gpt-5
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false
  retry_bare_retry_v2:
    retry:
      enabled: true
  retry_leg_critique_strict_v2:
    retry:
      enabled: true
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
  case_ids:
  - config_shadowing
  - invariant_partial_fail
  - async_race_lock
  - early_return_b
  - effect_order_c
  - false_fix_deadlock
  - feature_flag_drift
  - l3_state_pipeline
  - lost_update
  - missing_branch_c
  - cache_invalidation_order
  - use_before_set_b
  - config_shadowing
  - async_race_lock
evaluation:
  classifier_mode: grounded
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 50
  mode: canonical
  keep_eval_dirs: false
  subprocess_timeout: 30
  worker_stagger_seconds: 0
  token_budgets:
    gpt-5: 32000
    gpt-5.4-mini: 16000
    gpt-5-mini: 16000
    gpt-4o-mini: 16000
    gpt-4.1-nano: 12000
    default: 10000
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 20
