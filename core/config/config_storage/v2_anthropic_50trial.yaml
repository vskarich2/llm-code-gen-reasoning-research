experiment:
  name: v2_anthropic_50trial
  description: '50-trial targeted ablation: 13 cases, 2 Anthropic models, 3 conditions'
  tags:
  - v2
  - anthropic
  - targeted
  - 50trial
  - canonical
  seed: 42
run:
  trial: 1
  run_id: v2_anth_50t
  run_dir: logs/v2_anthropic_50trial
models:
  generation:
  - name: claude-3-haiku-20240307
    temperature: 0.0
    max_tokens: 4096
    top_p: 1.0
  - name: claude-sonnet-4-20250514
    temperature: 0.0
    max_tokens: 8192
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
  case_ids:
  - invariant_partial_fail
  - cache_invalidation_order
  - hidden_dep_multihop
  - alias_config_c
  - mutable_default_b
  - early_return_a
  - lost_update
  - lazy_init_b
  - wrong_condition_b
  - commit_gate
  - stale_cache_a
  - mutable_default_c
  - config_shadowing
evaluation:
  classifier_mode: grounded
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 50
  mode: canonical
  keep_eval_dirs: false
  subprocess_timeout: 30
  worker_stagger_seconds: 0
  token_budgets:
    claude-3-haiku-20240307: 4096
    claude-sonnet-4-20250514: 8192
    gpt-5-mini: 16000
    default: 8192
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 50
