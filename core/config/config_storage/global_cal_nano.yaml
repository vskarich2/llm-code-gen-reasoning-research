cases:
  case_ids:
  - alias_config_a
  - alias_config_b
  - alias_config_c
  - async_race_lock
  - cache_invalidation_order
  - commit_gate
  - config_shadowing
  - early_return_a
  - early_return_b
  - early_return_c
  - effect_order_a
  - effect_order_b
  - feature_flag_drift
  - index_misalign_a
  - index_misalign_b
  - index_misalign_c
  - invariant_partial_fail
  - l3_state_pipeline
  - lazy_init_b
  - lazy_init_c
  - lost_update
  - missing_branch_a
  - missing_branch_b
  - missing_branch_c
  - mutable_default_b
  - mutable_default_c
  - ordering_dependency
  - overdetermination
  - partial_rollback_a
  - partial_rollback_b
  - partial_rollback_c
  - partial_update_a
  - partial_update_c
  - retry_dup_a
  - retry_dup_b
  - silent_default_b
  - stale_cache_a
  - stale_cache_c
  - temporal_drift_a
  - temporal_drift_b
  - use_before_set_b
  - use_before_set_c
  - wrong_condition_a
  - wrong_condition_b
  - wrong_condition_c
  max_cases: 0
  mode: all
  source: case_data/cases_v2.json
conditions:
  retry_bare_retry_v2:
    retry:
      enabled: true
  retry_leg_critique_strict_v2:
    retry:
      enabled: true
  retry_reasoning_only_critique_v1:
    retry:
      enabled: true
evaluation:
  alignment:
    enabled: true
  classifier_mode: grounded
  failure_classification:
    enabled: true
  leg:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  keep_eval_dirs: false
  mode: canonical
  num_workers: 400
  subprocess_timeout: 30
  token_budgets:
    default: 10000
    gpt-5-mini: 16000
    gpt-5.4-mini: 16000
  worker_stagger_seconds: 0
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
experiment:
  description: 'Global calibration: gpt-4.1-nano, 45 cases'
  name: global_calibration
  seed: 42
  tags:
  - global_calibration
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
models:
  evaluator:
    max_tokens: 128000
    name: gpt-5-mini
    temperature: 0.0
  generation:
  - max_tokens: 128000
    name: gpt-4.1-nano
    temperature: 0.0
    top_p: 1.0
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
prompts:
  output_format: v2
run:
  run_dir: logs/global_calibration/nano
  run_id: gc_nano
  trial: 1
trials: 10
