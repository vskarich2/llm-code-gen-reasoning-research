experiment:
  name: oracle_nano_3t3c
  description: "Inline oracle ablation: gpt-4.1-nano gen, gpt-5-mini eval+oracle, 3 conditions, 3 trials, all cases"
  tags:
  - oracle_inline
  - ablation
  - nano
  seed: 42

run:
  trial: 1
  run_id: oracle_nano_3t3c_001
  run_dir: logs/oracle_nano_3t3c

models:
  generation:
  - name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5

conditions:
  baseline_v3:
    retry:
      enabled: false
    prompt_template: baseline
  leg_reduction_lean_v3:
    retry:
      enabled: false
    prompt_template: leg_reduction_lean


oracle:
  inline_enabled: true
  model: gpt-5-mini
  partial_mode: lenient
  sampling_strategy: ALWAYS

cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0

evaluation:
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  classifier_mode: blind
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3

execution:
  num_workers: 300
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-5-mini: 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192

prompts:
  output_format: v3

logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false

retry_defaults:
  max_attempts: 5
  feedback:
    include_test_output: true
    include_critique: false
    include_previous_code: true
  stopping:
    stop_on_pass: true
    stop_on_stagnation: false

trials: 3
