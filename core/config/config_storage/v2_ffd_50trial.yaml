experiment:
  name: v2_ffd_50trial
  description: '50-trial ablation: false_fix_deadlock, gpt-5-mini, 5 conditions'
  tags:
  - v2
  - retry
  - critique
  - 50trial
  - ffd
  seed: 42
run:
  trial: 1
  run_id: v2_ffd_t1
  run_dir: logs/v2_ffd_50trial
models:
  generation:
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  retry_bare_retry_v2:
    retry:
      enabled: false
  retry_leg_critique_strict_v2:
    retry:
      enabled: false
  retry_leg_critique_moderate_v2:
    retry:
      enabled: false
  retry_no_contract_v2:
    retry:
      enabled: false
cases:
  source: case_data/cases_v2_ffd.json
  mode: all
  max_cases: 0
evaluation:
  classifier_mode: grounded
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 1
  worker_stagger_seconds: 1
  token_budgets:
    gpt-5-mini: 16000
    default: 10000
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 50
