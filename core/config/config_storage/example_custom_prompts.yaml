experiment:
  name: custom_prompt_example
  description: Example showing custom generation + classifier prompts
  tags:
  - example
  - custom_prompts
  seed: 42
run:
  trial: 1
  run_id: custom_prompt_t1
  run_dir: logs/custom_prompt_example
models:
  generation:
  - name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false
  leg_reduction_v2:
    retry:
      enabled: false
evaluation:
  classifier_mode: grounded
  classifier_template: classify_reasoning_v2
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
  case_ids:
  - partial_update_a
  - alias_config_a
execution:
  num_workers: 4
  worker_stagger_seconds: 1
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-5-mini: 16000
    default: 10000
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 2
