experiment:
  name: smoke_logical_keys
  description: "Smoke test: verify bare-filename logical keys work end-to-end"
  tags: [smoke]
  seed: 42

run:
  trial: 1
  run_id: smoke_lk_001
  run_dir: logs/smoke_logical_keys

models:
  generation:
    - name: gpt-4.1-nano
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
  evaluator:
    name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes: ["o1", "o3", "o4", "gpt-5"]

conditions:
  baseline_v2:
    retry:
      enabled: false
    prompt_template: baseline_v2

cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 3

evaluation:
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  classifier_mode: blind
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2

execution:
  num_workers: 1
  token_budgets:
    gpt-4.1-nano: 12000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_stagger_seconds: 3
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192

prompts:
  output_format: v2

logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false

trials: 1
