experiment:
  name: smoke_ddc_38
  description: "Smoke ablation: 38 DDC cases, gpt-4.1-nano, baseline only, 1 trial"
  tags:
    - smoke
    - deep_dependency_chain
  seed: 42

run:
  trial: 1
  run_id: smoke_ddc_38_001
  run_dir: logs/smoke_ddc_38

models:
  generation:
    - name: gpt-4.1-nano
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
    - o1
    - o3
    - o4
    - gpt-5

conditions:
  baseline_v3:
    retry:
      enabled: false

oracle:
  inline_enabled: true
  model: gpt-5-mini
  prompt_template: oracle_reasoning_truth_enriched
  partial_mode: lenient
  sampling_strategy: ALWAYS

evaluation:
  classifier_mode: blind
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict

cases:
  source: case_data/cases_v2.json
  case_ids:
    - auth_context_chain
    - billing_aggregation_chain
    - config_derivation_chain
    - event_etl_chain
    - logging_pipeline_chain
    - ml_feature_chain
    - search_index_chain
    - serialization_pipeline_chain
    - auth_context_chain_trap_1
    - auth_context_chain_trap_3
    - auth_context_chain_trap_4
    - auth_context_chain_trap_5
    - billing_aggregation_chain_trap_1
    - billing_aggregation_chain_trap_3
    - billing_aggregation_chain_trap_4
    - billing_aggregation_chain_trap_5
    - config_derivation_chain_trap_1
    - config_derivation_chain_trap_3
    - config_derivation_chain_trap_4
    - config_derivation_chain_trap_5
    - event_etl_chain_trap_1
    - event_etl_chain_trap_3
    - event_etl_chain_trap_4
    - event_etl_chain_trap_5
    - logging_pipeline_chain_trap_1
    - logging_pipeline_chain_trap_3
    - logging_pipeline_chain_trap_4
    - logging_pipeline_chain_trap_5
    - ml_feature_chain_trap_1
    - ml_feature_chain_trap_3
    - ml_feature_chain_trap_4
    - ml_feature_chain_trap_5
    - search_index_chain_trap_3
    - search_index_chain_trap_5
    - serialization_pipeline_chain_trap_1
    - serialization_pipeline_chain_trap_3
    - serialization_pipeline_chain_trap_4
    - serialization_pipeline_chain_trap_5

execution:
  num_workers: 20
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  validate_prompts: true
  token_budgets:
    gpt-4.1-nano: 12000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192

prompts:
  output_format: v2

logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false

trials: 1
