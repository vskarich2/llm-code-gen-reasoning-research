experiment:
  name: v4_gpt_5_4_mini_v4c3_transformation_localization
  description: gpt-5.4-mini v4c3_transformation_localization on 16 failed cases
  tags:
  - hint_ablation_v4
  seed: 42
run:
  trial: 1
  run_id: v4_gpt_5_4_mini_v4c3_transformation_localization_001
  run_dir: logs/hint_ablation_v4
models:
  generation:
  - name: gpt-5.4-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  critique_strict_v3:
    retry:
      enabled: true
      max_attempts: 2
      feedback:
        include_test_output: false
        include_critique: true
        include_previous_code: true
      stopping:
        stop_on_pass: true
        stop_on_stagnation: false
    critique:
      enabled: true
oracle:
  inline_enabled: true
  model: gpt-5-mini
  prompt_template: oracle_reasoning_truth_enriched
  partial_mode: lenient
  sampling_strategy: ALWAYS
evaluation:
  classifier_mode: blind
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  depth_hint_level: v4_transformation_localization
cases:
  source: case_data/cases_v2.json
  case_ids:
  - auth_context_chain_trap_1
  - auth_context_chain_trap_4
  - auth_context_chain_trap_5
  - billing_aggregation_chain
  - billing_aggregation_chain_trap_1
  - billing_aggregation_chain_trap_3
  - billing_aggregation_chain_trap_4
  - billing_aggregation_chain_trap_5
  - config_derivation_chain
  - config_derivation_chain_trap_5
  - event_etl_chain_trap_5
  - ml_feature_chain_trap_1
  - ml_feature_chain_trap_3
  - serialization_pipeline_chain_trap_1
  - serialization_pipeline_chain_trap_4
  - serialization_pipeline_chain_trap_5
execution:
  num_workers: 16
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  validate_prompts: true
  token_budgets:
    gpt-5.4-mini: 16000
    gpt-5-mini: 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 1
