experiment:
  name: lag_gpt_41_nano_t2
  description: 'LAG ablation: gpt-4.1-nano trial 2, baseline + simplified LAG'
  tags:
  - ablation
  - lag
  - gpt-4.1-nano
  - trial2
  seed: 44
run:
  trial: 2
  run_id: gpt_41_nano_t2
  run_dir: logs/ablation_lag/gpt-4.1-nano
models:
  generation:
  - name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
conditions:
  baseline:
    retry:
      enabled: false
    prompt_template: baseline
  leg_reduction:
    retry:
      enabled: false
    prompt_template: leg_reduction
cases:
  source: cases_v2.json
  mode: all
  max_cases: 0
evaluation:
  subprocess_timeout: 30
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
execution:
  num_workers: 1
  token_budgets:
    gpt-4.1-nano: 128000
    gpt-5-mini: 128000
    default: 128000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  store:
    raw_prompts: true
    raw_outputs: true
  redis:
    enabled: false
trials: 1
