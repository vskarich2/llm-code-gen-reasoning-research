experiment:
  name: smoke_v3_prompts
  description: Smoke test for v3 prompt family
  tags:
  - smoke
  - v3
  seed: 42
run:
  trial: 1
  run_id: v3_smoke
  run_dir: logs/smoke_v3_prompts
models:
  generation:
  - name: gpt-4.1-nano
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v3:
    retry:
      enabled: false
evaluation:
  classifier_mode: grounded
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
  case_ids:
  - partial_update_a
execution:
  num_workers: 1
  worker_stagger_seconds: 0
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-5-mini: 16000
    default: 10000
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 1
