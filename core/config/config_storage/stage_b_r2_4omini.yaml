cases:
  case_ids:
  - false_fix_deadlock
  - use_before_set_b
  - invariant_partial_fail
  - async_race_lock
  - config_shadowing
  max_cases: 0
  mode: all
  source: case_data/cases_v2.json
conditions:
  baseline_v2:
    retry:
      enabled: false
  retry_bare_retry_v2:
    retry:
      enabled: true
  retry_leg_critique_strict_v2:
    retry:
      enabled: true
  retry_reasoning_only_critique_v1:
    retry:
      enabled: true
evaluation:
  alignment:
    enabled: true
  classifier_mode: grounded
  failure_classification:
    enabled: true
  leg:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  keep_eval_dirs: false
  mode: canonical
  num_workers: 100
  subprocess_timeout: 30
  token_budgets:
    default: 10000
    gpt-5-mini: 16000
    gpt-5.4-mini: 16000
  worker_stagger_seconds: 0
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
experiment:
  description: 'Stage B round 2: 40 more trials'
  name: stage_b_critique_r2
  seed: 42
  tags:
  - stage_b
  - round2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
models:
  evaluator:
    max_tokens: 128000
    name: gpt-5-mini
    temperature: 0.0
  generation:
  - max_tokens: 128000
    name: gpt-4o-mini
    temperature: 0.0
    top_p: 1.0
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
prompts:
  output_format: v2
run:
  run_dir: logs/stage_b_critique_r2/openai_4omini
  run_id: sb_r2_4omini
  trial: 51
trials: 40
