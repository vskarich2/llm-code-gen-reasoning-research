experiment:
  name: orchestrator_test
  description: Test config for orchestrator dry-run
models:
  generation:
  - name: gpt-5.4-mini
    temperature: 0.0
    max_tokens: 128000
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  - name: gpt-4o-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
- baseline_v2
- leg_reduction_v2
trials: 8
cases:
  source: case_data/cases_v2.json
  max_cases: 0
execution:
  parallelism: 3
  worker_stagger_seconds: 3
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
output:
  base_dir: experiments
