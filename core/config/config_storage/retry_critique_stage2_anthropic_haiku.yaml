cases:
  case_ids:
  - lost_update
  max_cases: 0
  mode: all
  source: case_data/cases_v2.json
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false
  retry_bare_retry_v2:
    retry:
      enabled: true
  retry_leg_critique_strict_v2:
    retry:
      enabled: true
evaluation:
  alignment:
    enabled: true
  classifier_mode: grounded
  failure_classification:
    enabled: true
  leg:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  keep_eval_dirs: false
  mode: canonical
  num_workers: 25
  subprocess_timeout: 30
  token_budgets:
    claude-haiku-4-5-20251001: 8192
    default: 10000
    gpt-5-mini: 16000
  worker_stagger_seconds: 0
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
experiment:
  description: 'Stage 2: confirmatory, 50 trials'
  name: retry_critique_stage2
  seed: 42
  tags:
  - retry
  - critique
  - stage2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
models:
  evaluator:
    max_tokens: 128000
    name: gpt-5-mini
    temperature: 0.0
  generation:
  - max_tokens: 8192
    name: claude-haiku-4-5-20251001
    temperature: 0.0
    top_p: 1.0
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
prompts:
  output_format: v2
run:
  run_dir: logs/retry_critique_stage2/anthropic_haiku
  run_id: rc_s2_anthropic_haiku
  trial: 1
trials: 50
