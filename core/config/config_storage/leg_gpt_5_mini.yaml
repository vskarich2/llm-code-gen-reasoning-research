experiment:
  name: leg_gpt_5_mini
  description: 'LEG-reduction: gpt-5-mini gen, gpt-5-mini eval, all v2 cases'
  tags:
  - leg
  - ablation
  seed: 42
run:
  trial: 1
  run_id: leg_gpt_5_mini_001
  run_dir: logs/leg_3model_ablation/gpt_5_mini
models:
  generation:
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  leg_reduction:
    retry:
      enabled: false
    prompt_template: leg_reduction
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
evaluation:
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  classifier_mode: blind
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 1
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-4o-mini: 12000
    gpt-5-mini: 16000
    default: 10000
  worker_stagger_seconds: 3
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 1
