experiment:
  name: retry_critique_stage0_anthropic
  description: "Stage 0: T=0 determinism precondition check \u2014 Anthropic regime"
  tags:
  - retry
  - critique
  - stage0
  - precondition
  - anthropic
  seed: 42
run:
  trial: 1
  run_id: rc_s0_anth
  run_dir: logs/retry_critique_stage0_anthropic
models:
  generation:
  - name: claude-haiku-4-5-20251001
    temperature: 0.0
    max_tokens: 8192
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  retry_bare_retry_v2:
    retry:
      enabled: true
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
  case_ids:
  - lost_update
evaluation:
  classifier_mode: grounded
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 20
  mode: canonical
  keep_eval_dirs: false
  subprocess_timeout: 30
  worker_stagger_seconds: 0
  token_budgets:
    claude-haiku-4-5-20251001: 8192
    gpt-5-mini: 16000
    default: 8192
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 50
