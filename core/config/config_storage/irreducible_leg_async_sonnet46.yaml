experiment:
  name: irreducible_leg_async_v2
  description: Re-probe async_race_lock after prompt change, claude-sonnet-4-6
  tags:
  - irreducible_leg
  - async_race_lock
  - prompt_v2
  seed: 42
run:
  trial: 1
  run_id: async_v2_sonnet46
  run_dir: logs/irreducible_leg_async_v2/sonnet46
models:
  generation:
  - name: claude-sonnet-4-6
    temperature: 0.0
    max_tokens: 8192
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false
  retry_reasoning_only_critique_v1:
    retry:
      enabled: true
  retry_leg_critique_strict_v2:
    retry:
      enabled: true
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
  case_ids:
  - async_race_lock
evaluation:
  classifier_mode: grounded
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 10
  worker_stagger_seconds: 2
  token_budgets:
    claude-sonnet-4-6: 8192
    gpt-5-mini: 16000
    default: 10000
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 10
