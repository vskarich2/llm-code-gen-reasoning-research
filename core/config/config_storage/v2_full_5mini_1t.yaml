experiment:
  name: v2_full_5mini
  description: 'V2 full ablation: gpt-5-mini gen, gpt-5-mini eval, 3 conditions, all
    cases'
  tags:
  - v2
  - ablation
  - full
  seed: 42
run:
  trial: 1
  run_id: v2_full_5mini_t1
  run_dir: logs/v2_full_ablation
models:
  generation:
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false
cases:
  source: case_data/cases_v2.json
  mode: all
  max_cases: 0
evaluation:
  classifier_mode: grounded
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  classifier_template: classify_reasoning_v2
  classifier_schema_variant: v2_semicolon
  generation_schema_variant: v2
execution:
  num_workers: 8
  worker_stagger_seconds: 3
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-4o-mini: 16000
    gpt-5-mini: 16000
    default: 10000
  subprocess_timeout: 30
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  validate_prompts: true
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 1
