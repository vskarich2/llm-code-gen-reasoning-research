experiment:
  name: v2_hints_first_corruption
  description: Non-DDC v2 cases, gpt-4o-mini, first_corruption hint, 1 trial
  tags:
  - v2_hint_ablation
  seed: 42
run:
  trial: 1
  run_id: v2_hints_first_corruption_001
  run_dir: logs/v2_hint_ablation
models:
  generation:
  - name: gpt-4o-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
  - o1
  - o3
  - o4
  - gpt-5
conditions:
  critique_strict_v3:
    retry:
      enabled: true
      max_attempts: 2
      feedback:
        include_test_output: false
        include_critique: true
        include_previous_code: true
      stopping:
        stop_on_pass: true
        stop_on_stagnation: false
    critique:
      enabled: true
oracle:
  inline_enabled: true
  model: gpt-5-mini
  prompt_template: oracle_reasoning_truth_enriched
  partial_mode: lenient
  sampling_strategy: ALWAYS
evaluation:
  classifier_mode: blind
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict
  depth_hint_level: v4_first_corruption
cases:
  source: case_data/cases_v2.json
  case_ids:
  - alias_config_a
  - alias_config_b
  - alias_config_c
  - partial_update_a
  - partial_update_b
  - partial_update_c
  - stale_cache_a
  - stale_cache_b
  - stale_cache_c
  - lazy_init_a
  - lazy_init_b
  - lazy_init_c
  - mutable_default_a
  - mutable_default_b
  - mutable_default_c
  - effect_order_a
  - effect_order_b
  - effect_order_c
  - use_before_set_a
  - use_before_set_b
  - use_before_set_c
  - retry_dup_a
  - retry_dup_b
  - retry_dup_c
  - partial_rollback_a
  - partial_rollback_b
  - partial_rollback_c
  - temporal_drift_a
  - temporal_drift_b
  - temporal_drift_c
  - missing_branch_a
  - missing_branch_b
  - missing_branch_c
  - wrong_condition_a
  - wrong_condition_b
  - wrong_condition_c
  - early_return_a
  - early_return_b
  - early_return_c
  - index_misalign_a
  - index_misalign_b
  - index_misalign_c
  - silent_default_a
  - silent_default_b
  - silent_default_c
  - l3_state_pipeline
  - cache_invalidation_order
  - feature_flag_drift
  - invariant_partial_fail
  - async_race_lock
  - hidden_dep_multihop
  - config_shadowing
  - commit_gate
  - overdetermination
  - lost_update
  - check_then_act
  - ordering_dependency
  - false_fix_deadlock
  - duplicate_write_deep_dependency_chain_c
  - duplicate_write_competing_c_v2
  - transform_pipeline_unit_drift_c_v3
  - versioned_policy_fallback_regression_l3
  - versioned_policy_fallback_regression_b
  - write_through_shadow_cache_l3_gold
  - deferred_commit_selector_split_b_plus
  - deferred_commit_selector_split_l3_adversarial_gold
  - duplicate_write_retry_hidden_b_plus
  - derived_field_stale_a_plus
  - versioned_policy_fallback_regression_b_plus
  - duplicate_write_retry_hidden_b_plus_adv
  - derived_field_stale_b_plus
  - versioned_policy_fallback_regression_b_plus_adv
execution:
  num_workers: 36
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  validate_prompts: true
  token_budgets:
    gpt-4o-mini: 12000
    gpt-5-mini: 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false
trials: 1
