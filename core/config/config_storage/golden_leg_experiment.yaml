experiment:
  name: golden_leg_experiment
  description: "Golden LEG experiment: 24 SWE-bench cases, gpt-5.4-mini, baseline_v3"
  tags:
    - golden
    - leg
    - swebench
  seed: 42

run:
  trial: 1
  run_id: golden_leg_001
  run_dir: logs/golden_leg_experiment

models:
  generation:
    - name: gpt-5.4-mini
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
    - o1
    - o3
    - o4
    - gpt-5

conditions:
  baseline_v3:
    retry:
      enabled: false

oracle:
  inline_enabled: true
  model: gpt-5-mini
  prompt_template: oracle_reasoning_truth_enriched
  partial_mode: strict
  sampling_strategy: ALWAYS

evaluation:
  classifier_mode: grounded
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict

cases:
  source: case_data/swe_cases_v2.json
  case_ids:
    - swe_astropy_astropy_14369
    - swe_astropy_astropy_8707
    - swe_django_django_11333
    - swe_django_django_11734
    - swe_django_django_12155
    - swe_django_django_12406
    - swe_django_django_13121
    - swe_django_django_13195
    - swe_django_django_13512
    - swe_django_django_14170
    - swe_django_django_14315
    - swe_django_django_14631
    - swe_django_django_16631
    - swe_django_django_16938
    - swe_matplotlib_matplotlib_25479
    - swe_mwaskom_seaborn_3187
    - swe_pylint_dev_pylint_6528
    - swe_pylint_dev_pylint_8898
    - swe_scikit_learn_scikit_learn_25102
    - swe_sphinx_doc_sphinx_7462
    - swe_sphinx_doc_sphinx_8551
    - swe_sympy_sympy_17318
    - swe_sympy_sympy_19783
    - swe_sympy_sympy_22080

execution:
  num_workers: 40
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  validate_prompts: true
  token_budgets:
    gpt-5.4-mini: 16000
    gpt-5-mini: 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192

prompts:
  output_format: v2

logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false

trials: 1
