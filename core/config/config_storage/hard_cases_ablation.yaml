experiment:
  name: hard_cases_ablation
  description: "Hard multi-file cases only, 3 models, 10 trials, baseline_v2 + baseline_v3"
  tags:
    - hard_cases
    - v3
  seed: 42

run:
  trial: 10
  run_id: hard_cases_001
  run_dir: logs/hard_cases_ablation

models:
  generation:
    - name: gpt-4.1-nano
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
    - name: gpt-4o-mini
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
    - name: gpt-5.4-mini
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
    - name: gpt-5-mini
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
    - o1
    - o3
    - o4
    - gpt-5

conditions:
  baseline_v3:
    retry:
      enabled: false

oracle:
  inline_enabled: true
  model: gpt-5-mini
  prompt_template: oracle_reasoning_truth_enriched
  partial_mode: lenient
  sampling_strategy: ALWAYS

evaluation:
  classifier_mode: blind
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict

cases:
  source: case_data/cases_v2.json
  case_ids:
    - commit_gate
    - l3_state_pipeline
    - async_race_lock
    - false_fix_deadlock
    - lost_update
    - check_then_act
    - config_shadowing
    - feature_flag_drift
    - hidden_dep_multihop
    - invariant_partial_fail
    - ordering_dependency
    - cache_invalidation_order
    - overdetermination
    - missing_branch_c
  mode: all

execution:
  num_workers: 300
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  validate_prompts: true
  token_budgets:
    gpt-4.1-nano: 12000
    gpt-5-mini: 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192

prompts:
  output_format: v2

logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false

trials: 10
