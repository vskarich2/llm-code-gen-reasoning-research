experiment:
  name: oracle_remaining_40
  description: "Oracle + classifier for 40 remaining SWE-bench cases"
  tags:
    - oracle
    - swebench
  seed: 42

run:
  trial: 1
  run_id: oracle_remaining_001
  run_dir: logs/oracle_remaining_40

models:
  generation:
    - name: gpt-5.4-mini
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
  no_temperature_prefixes:
    - o1
    - o3
    - o4
    - gpt-5

conditions:
  baseline_v3:
    retry:
      enabled: false

oracle:
  inline_enabled: true
  model: gpt-5-mini
  prompt_template: oracle_reasoning_truth_enriched
  partial_mode: strict
  sampling_strategy: ALWAYS

evaluation:
  classifier_mode: grounded
  classifier_template: classify_reasoning_v3
  classifier_schema_variant: v3_json
  generation_schema_variant: v3
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
  reasoning_correct_mode: strict

cases:
  source: case_data/swe_cases_v2.json
  case_ids:
    - swe_astropy_astropy_13398
    - swe_django_django_11138
    - swe_django_django_11400
    - swe_django_django_11532
    - swe_django_django_11885
    - swe_django_django_12325
    - swe_django_django_13212
    - swe_django_django_13344
    - swe_django_django_14011
    - swe_django_django_14376
    - swe_django_django_14631
    - swe_django_django_15103
    - swe_django_django_15561
    - swe_django_django_15563
    - swe_django_django_15629
    - swe_django_django_16032
    - swe_django_django_16256
    - swe_django_django_16263
    - swe_django_django_16315
    - swe_django_django_16560
    - swe_matplotlib_matplotlib_14623
    - swe_matplotlib_matplotlib_25775
    - swe_mwaskom_seaborn_3187
    - swe_pydata_xarray_3095
    - swe_pydata_xarray_3993
    - swe_pydata_xarray_6992
    - swe_pylint_dev_pylint_4551
    - swe_pylint_dev_pylint_6386
    - swe_pytest_dev_pytest_5840
    - swe_pytest_dev_pytest_8399
    - swe_scikit_learn_scikit_learn_12682
    - swe_sphinx_doc_sphinx_10673
    - swe_sphinx_doc_sphinx_7590
    - swe_sphinx_doc_sphinx_8593
    - swe_sphinx_doc_sphinx_9461
    - swe_sympy_sympy_13091
    - swe_sympy_sympy_13877
    - swe_sympy_sympy_14248
    - swe_sympy_sympy_16597
    - swe_sympy_sympy_20438

execution:
  num_workers: 40
  worker_stagger_seconds: 0
  subprocess_timeout: 30
  validate_prompts: true
  token_budgets:
    gpt-5.4-mini: 16000
    gpt-5-mini: 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
  worker_timeout_seconds: 600
  worker_graceful_shutdown_seconds: 30
  mode: canonical
  keep_eval_dirs: false
  recovery_execution: true
  max_orchestrator_attempts: 10
  anthropic_client_timeout: 120.0
  anthropic_max_output_tokens: 8192

prompts:
  output_format: v2

logging:
  level: INFO
  output_dir: logs/
  redis:
    enabled: false

trials: 1
