# Prompt Manifest — maps condition → component list + nudge resolution
#
# This is the SINGLE source of truth for which templates compose each condition.
# To change a condition's prompt, edit this file — no Python code changes needed.
#
# Fields:
#   components: ordered list of template names (from prompts/components/)
#   nudge: how to resolve the nudge variable
#     type: "operator" | "registry" | "scm" | "none"
#     field: operator field name (for type=operator)
#     key: registry key (for type=registry)
#     variable: which template variable receives the nudge text
#   label: operator_used label returned by build_prompt
#   include_output_instruction: whether to append output instruction (default: true)
#   guardrail_strict: whether to append hard constraints (default: false)

conditions:
  baseline:
    components: ["task_and_code"]
    nudge:
      type: "none"
    label: null

  diagnostic:
    components: ["task_and_code", "nudge_diagnostic"]
    nudge:
      type: "operator"
      field: "diagnostic"
      variable: "diagnostic_text"
    label: null  # uses operator name

  guardrail:
    components: ["task_and_code", "nudge_diagnostic"]
    nudge:
      type: "operator"
      field: "guardrail"
      variable: "diagnostic_text"
    label: null

  guardrail_strict:
    components: ["task_and_code", "nudge_diagnostic"]
    nudge:
      type: "operator"
      field: "guardrail"
      variable: "diagnostic_text"
    guardrail_strict: true
    label: null

  counterfactual:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__counterfactual"
      variable: "reasoning_text"
    label: "COUNTERFACTUAL"

  reason_then_act:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__reason_then_act"
      variable: "reasoning_text"
    label: "REASON_THEN_ACT"

  self_check:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__self_check"
      variable: "reasoning_text"
    label: "SELF_CHECK"

  counterfactual_check:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__counterfactual_check"
      variable: "reasoning_text"
    label: "COUNTERFACTUAL_CHECK"

  test_driven:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__test_driven"
      variable: "reasoning_text"
    label: "TEST_DRIVEN"

  repair_loop:
    components: ["task_and_code", "nudge_diagnostic"]
    nudge:
      type: "operator"
      field: "diagnostic"
      variable: "diagnostic_text"
    label: "REPAIR_LOOP"

  structured_reasoning:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__structured"
      variable: "reasoning_text"
    label: "STRUCTURED_REASONING"

  free_form_reasoning:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__free_form"
      variable: "reasoning_text"
    label: "FREE_FORM_REASONING"

  branching_reasoning:
    components: ["task_and_code", "nudge_reasoning"]
    nudge:
      type: "registry"
      key: "reasoning__branching"
      variable: "reasoning_text"
    label: "BRANCHING_REASONING"

  # SCM conditions
  scm_descriptive:
    components: ["task_and_code", "nudge_scm"]
    nudge:
      type: "scm"
      scm_mode: "scm_descriptive"
    label: "SCM_DESCRIPTIVE"

  scm_constrained:
    components: ["task_and_code", "nudge_scm"]
