      scm_mode: "scm_constrained"
    label: "SCM_CONSTRAINED"

  scm_constrained_evidence:
    components: ["task_and_code", "nudge_scm"]
    nudge:
      type: "scm"
      scm_mode: "scm_constrained_evidence"
    label: "SCM_EVIDENCE"

  scm_constrained_evidence_minimal:
    components: ["task_and_code", "nudge_scm"]
    nudge:
      type: "scm"
      scm_mode: "scm_constrained_evidence_minimal"
