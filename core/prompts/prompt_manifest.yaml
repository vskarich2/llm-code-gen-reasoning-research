  evidence_only:
    components: ["task_and_code", "nudge_scm"]
    nudge:
      type: "scm"
      scm_mode: "evidence_only"
    label: "EVIDENCE_ONLY"

  length_matched_control:
    components: ["task_and_code", "nudge_scm"]
    nudge:
      type: "scm"
      scm_mode: "length_matched_control"
    label: "LENGTH_CONTROL"

  # Multi-step conditions (prompt built by execution strategy, not build_prompt)
  contract_gated:
    components: ["task_and_code"]
    nudge:
      type: "none"
    include_output_instruction: false
    label: "CONTRACT_GATED"

  leg_reduction:
