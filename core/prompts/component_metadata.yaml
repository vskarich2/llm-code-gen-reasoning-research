  conditional_groups:
    - name: descriptive
      condition_expr: 'scm_mode == "descriptive"'
      required_inputs: [scm_edges, scm_failure]
      optional_inputs: []
    - name: constrained
      condition_expr: 'scm_mode == "constrained"'
      required_inputs: [scm_edges, scm_constraints, scm_invariants]
      optional_inputs: []
    - name: constrained_evidence
      condition_expr: 'scm_mode == "constrained_evidence"'
      required_inputs: [scm_edges, scm_constraints, scm_invariants, scm_functions, scm_variables, scm_cc_id, scm_cc_why, scm_cc_trace, scm_inv_checks]
      optional_inputs: []
    - name: minimal
      condition_expr: 'scm_mode == "minimal"'
      required_inputs: [scm_edges, scm_constraints, scm_invariants]
      optional_inputs: []
    - name: evidence_only
      condition_expr: 'scm_mode == "evidence_only"'
      required_inputs: [scm_functions, scm_variables, scm_constraints, scm_invariants]
      optional_inputs: []
    - name: length_control
