rules:

# ============================================================
# TIER 1 — HARD FAILS (Invariant Enforcement)
# ============================================================

# 1. No bare except
- id: no-bare-except
  pattern: |
    try:
      ...
    except:
      ...
  message: "Bare except is forbidden (INV-03)"
  severity: ERROR
  languages: [python]

# 2. No silent except pass
- id: no-except-pass
  pattern: |
    try:
      ...
    except ...:
      pass
  message: "Silent exception handling is forbidden (INV-03)"
  severity: ERROR
  languages: [python]

# 3. No broad except without re-raise
- id: no-broad-except-without-reraise
  patterns:
    - pattern: |
        try:
          ...
        except Exception as $E:
          ...
    - pattern-not: |
        try:
          ...
        except Exception as $E:
          raise
  message: "Broad exception must be re-raised (logging alone is insufficient)"
  severity: ERROR
  languages: [python]

# 4. No global state
- id: no-global-state
  pattern: global $X
  message: "Global state is forbidden (INV-11)"
  severity: ERROR
  languages: [python]

# 5. No mutable default arguments
- id: no-mutable-default
  pattern-either:
    - pattern: |
        def $F(..., $X=[], ...):
          ...
    - pattern: |
        def $F(..., $X={}, ...):
          ...
    - pattern: |
        def $F(..., $X=set(), ...):
          ...
  message: "Mutable default argument is forbidden (INV-07)"
  severity: ERROR
  languages: [python]

# 6. No dynamic imports inside functions
- id: no-dynamic-import
  patterns:
    - pattern: |
        def $F(...):
          ...
          from $M import $X
    - pattern: |
        def $F(...):
          ...
          import $M
  message: "Imports inside functions are forbidden (INV-04)"
  severity: ERROR
  languages: [python]

# 7. No OpenAI client outside llm.py
- id: no-direct-openai-client
  pattern: OpenAI(...)
  message: "OpenAI client must only be constructed in llm.py (INV-02)"
  severity: ERROR
  languages: [python]
  paths:
    exclude:
      - llm.py
      - tests/

# 8. No threading usage
- id: no-threading
  pattern-either:
    - pattern: import threading
    - pattern: ThreadPoolExecutor(...)
  message: "Threading is forbidden (INV-06)"
  severity: ERROR
  languages: [python]

# 9. No unauthorized caching
- id: no-caching
  pattern-either:
    - pattern: |
        $CACHE = {}
    - pattern: |
        @$DECORATOR
    - metavariable-pattern:
        metavariable: $DECORATOR
        pattern: lru_cache
  message: "Caching is forbidden unless explicitly requested"
  severity: ERROR
  languages: [python]

# ============================================================
# TIER 2 — HIGH-SIGNAL WARNINGS
# ============================================================

# 10. No logging-only error handling
- id: no-logging-only-except
  patterns:
    - pattern: |
        try:
          ...
        except Exception as $E:
          logger.$LOG(...)
  message: "Logging without re-raise likely hides failure"
  severity: WARNING
  languages: [python]

# 11. No print debugging
- id: no-print
  pattern: print(...)
  message: "Use structured logging instead of print"
  severity: WARNING
  languages: [python]

# 12. No wildcard imports
- id: no-wildcard-import
  pattern: from $M import *
  message: "Wildcard imports are forbidden"
  severity: WARNING
  languages: [python]

# 13. File writes must use context manager
- id: no-open-without-context
  pattern: open($F, $MODE)
  metavariable-pattern:
    metavariable: $MODE
    pattern: "\"w\"|\"a\"|\"w\\+\"|\"wb\""
  message: "File writes must use a context manager (INV-10)"
  severity: WARNING
  languages: [python]