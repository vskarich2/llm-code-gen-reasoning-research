[project]
name = "t3-code-generation"
version = "0.1.0"
description = "T3 Code Generation Benchmark"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=2.29.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "python-dotenv>=1.2.2",
    "pytest>=9.0.2",
]

# ============================================================
# BLACK — formatting only
# ============================================================

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
/(
    _archive
  | \.venv
  | build
  | code_snippets_v2
)/
'''

# ============================================================
# RUFF — correctness-focused linting
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["_archive", ".venv", "build", "code_snippets_v2"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (real bugs)
    "I",   # import sorting
    "B",   # bugbear (high-signal)
    "UP",  # pyupgrade
    "RUF"  # Ruff-specific
]

ignore = [
    "E501"  # handled by black
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ============================================================
# PYRIGHT — single source of truth for types
# ============================================================

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"

reportMissingImports = true
reportMissingTypeStubs = false

reportUnknownMemberType = true
reportUnknownArgumentType = true

reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingParameterType = false

reportUnusedVariable = true
reportUnusedImport = true

# ============================================================
# PYTEST
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests", "core/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --disable-warnings"

# ============================================================
# DEV DEPENDENCIES — minimal, non-overlapping
# ============================================================

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.8",
    "pyright>=1.1.408",
    "semgrep>=1.70.0",
    "vulture>=2.16",
    "import-linter>=2.11",
]