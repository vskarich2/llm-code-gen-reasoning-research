experiment:
  name: "smoke_4omini_hard5"
  description: "Smoke test: gpt-4o-mini, 5 hard (3-file) cases, baseline + leg_reduction"
  tags: ["smoke", "hard", "4o-mini"]
  seed: 42

run:
  trial: 1
  run_id: "hard5_001"
  run_dir: "logs/smoke_hard5"

models:
  generation:
    - name: "gpt-4o-mini"
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0

  evaluator:
    name: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 128000
    max_task_chars: 128000
    max_code_chars: 128000
    max_reasoning_chars: 128000

conditions:
  baseline:
    retry:
      enabled: false
    prompt_template: "baseline"

  leg_reduction:
    retry:
      enabled: false
    prompt_template: "leg_reduction"

cases:
  source: "cases_v2.json"
  mode: "all"
  max_cases: 0

evaluation:
  execution_mode: "in_process"
  subprocess_timeout: 30
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true

execution:
  num_workers: 1
  token_budgets:
    "gpt-4o-mini": 128000
    default: 128000
  v3_pipeline:
    import_summary: false
    file_ordering: "dependency"

prompts:
  output_format: "v2"

logging:
  level: "INFO"
  output_dir: "logs/"
  store:
    raw_prompts: true
    raw_outputs: true
  redis:
    enabled: false

trials: 1
