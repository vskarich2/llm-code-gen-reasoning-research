experiment:
  name: "smoke_logging_test"
  description: "Smoke test: verify new logging pipeline with 3 cases x 3 conditions"
  tags: ["smoke", "logging"]
  seed: 42

run:
  trial: 1
  run_id: "smoke_log_001"
  run_dir: "logs/smoke_logging_test"

models:
  generation:
    - name: "gpt-4.1-nano"
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
  evaluator:
    name: "gpt-5-mini"
    temperature: 0.0
    max_tokens: 128000
    max_task_chars: 800
    max_code_chars: 2000
    max_reasoning_chars: 1000

conditions:
  baseline_v2:
    retry:
      enabled: false
  leg_reduction_v2:
    retry:
      enabled: false
  leg_reduction_lean_v2:
    retry:
      enabled: false

cases:
  source: "cases_v2.json"
  mode: "all"
  max_cases: 0

evaluation:
  execution_mode: "in_process"
  subprocess_timeout: 30
  classifier_mode: "grounded"
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true

execution:
  num_workers: 1
  token_budgets:
    "gpt-4.1-nano": 12000
    "gpt-5-mini": 16000
    default: 10000

prompts:
  output_format: "v2"

logging:
  level: "INFO"
  output_dir: "logs/"
  store:
    raw_prompts: true
    raw_outputs: true
  redis:
    enabled: false

trials: 1
