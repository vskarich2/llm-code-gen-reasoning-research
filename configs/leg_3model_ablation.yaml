experiment:
  name: "leg_3model_ablation"
  description: "LEG-reduction across 3 models, 1 trial, all v2 cases, gpt-5-mini eval"
  tags: ["leg", "ablation", "3model"]
  seed: 42

run:
  trial: 1
  run_id: "leg_3model"
  run_dir: "logs/leg_3model_ablation"

models:
  generation:
    - name: "gpt-4.1-nano"
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
    - name: "gpt-4o-mini"
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0
    - name: "gpt-5-mini"
      temperature: 0.0
      max_tokens: 128000
      top_p: 1.0

  evaluator:
    name: "gpt-5-mini"
    temperature: 0.0
    max_tokens: 128000
    max_task_chars: 800
    max_code_chars: 2000
    max_reasoning_chars: 1000

conditions:
  leg_reduction:
    retry:
      enabled: false
    prompt_template: "leg_reduction"

cases:
  source: "cases_v2.json"
  mode: "all"
  max_cases: 0

evaluation:
  execution_mode: "in_process"
  subprocess_timeout: 30
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true

execution:
  num_workers: 1
  token_budgets:
    "gpt-4.1-nano": 12000
    "gpt-4o-mini": 12000
    "gpt-5-mini": 16000
    default: 10000
  v3_pipeline:
    import_summary: false
    file_ordering: "dependency"

prompts:
  output_format: "v2"

logging:
  level: "INFO"
  output_dir: "logs/"
  store:
    raw_prompts: true
    raw_outputs: true
  redis:
    enabled: false

trials: 1
