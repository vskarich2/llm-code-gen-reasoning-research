experiment:
  name: ablation_gpt_5_mini_t2
  description: 'Full ablation: gpt-5-mini trial 2, 58 cases, baseline+LEG'
  tags:
  - ablation
  - full
  - gpt-5-mini
  - trial2
  seed: 44
run:
  trial: 2
  run_id: gpt_5_mini_t2
  run_dir: logs/ablation_full/gpt-5-mini
models:
  generation:
  - name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    top_p: 1.0
  evaluator:
    name: gpt-5-mini
    temperature: 0.0
    max_tokens: 128000
    max_task_chars: 128000
    max_code_chars: 128000
    max_reasoning_chars: 128000
conditions:
  baseline:
    retry:
      enabled: false
    prompt_template: baseline
  leg_reduction:
    retry:
      enabled: false
    prompt_template: leg_reduction
cases:
  source: cases_v2.json
  mode: all
  max_cases: 0
evaluation:
  execution_mode: in_process
  subprocess_timeout: 30
  leg:
    enabled: true
  failure_classification:
    enabled: true
  alignment:
    enabled: true
execution:
  num_workers: 1
  token_budgets:
    gpt-5-mini: 128000
    gpt-4o-mini: 128000
    default: 128000
  v3_pipeline:
    import_summary: false
    file_ordering: dependency
prompts:
  output_format: v2
logging:
  level: INFO
  output_dir: logs/
  store:
    raw_prompts: true
    raw_outputs: true
  redis:
    enabled: false
trials: 1
